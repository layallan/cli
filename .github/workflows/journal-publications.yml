name: Refresh journal publications
on:
  schedule:
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: journal-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
      - run: python scripts/sync_publications.py
      - name: Save changed journal records
        run: |
          git add -- public/journal-publications.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh journal bibliography"
          git push origin HEAD:main
